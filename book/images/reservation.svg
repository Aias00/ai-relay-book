<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" aria-labelledby="title desc"><title id="title">从初始预算到分段追加</title><desc id="desc">这是建议设计；取消不保证上游立即停止计费</desc><rect width="680" height="480" fill="#fffdf8"/><g font-family="sans-serif" fill="#20372e"><text x="24" y="36" font-size="23" font-weight="700">从初始预算到分段追加</text><rect x="24" y="65" width="632" height="68" rx="10" fill="#eef5f1" stroke="#b4cfc4"/><text x="42" y="92" font-size="19" font-weight="600">1 发送前预留</text><text x="42" y="117" font-size="15">本地估算输入与一段输出，Redis 原子取得占用</text><path d="M340 135v20m-5-5l5 5 5-5" stroke="#28685c" fill="none" stroke-width="2"/><rect x="24" y="160" width="632" height="68" rx="10" fill="#eef5f1" stroke="#b4cfc4"/><text x="42" y="187" font-size="19" font-weight="600">2 流中本地累计</text><text x="42" y="212" font-size="15">普通 chunk 不查余额；接近预算才申请更高目标</text><path d="M340 230v20m-5-5l5 5 5-5" stroke="#28685c" fill="none" stroke-width="2"/><rect x="24" y="255" width="632" height="68" rx="10" fill="#eef5f1" stroke="#b4cfc4"/><text x="42" y="282" font-size="19" font-weight="600">3 追加成功或取消</text><text x="42" y="307" font-size="15">同一操作可重试；不足则停止，保留未知用量</text><path d="M340 325v20m-5-5l5 5 5-5" stroke="#28685c" fill="none" stroke-width="2"/><rect x="24" y="350" width="632" height="68" rx="10" fill="#eef5f1" stroke="#b4cfc4"/><text x="42" y="377" font-size="19" font-weight="600">4 可靠保存结算</text><text x="42" y="402" font-size="15">按实际 usage 计算；后台提交后释放占用</text><text x="24" y="466" font-size="14">这是建议设计；取消不保证上游立即停止计费</text></g></svg>