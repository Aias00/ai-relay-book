<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" aria-labelledby="title desc"><title id="title">数据库提交与缓存收敛</title><desc id="desc">随书实验只验证数据库部分，不实现真实 Redis 消费者</desc><rect width="680" height="480" fill="#fffdf8"/><g font-family="sans-serif" fill="#20372e"><text x="24" y="36" font-size="23" font-weight="700">数据库提交与缓存收敛</text><rect x="24" y="65" width="632" height="68" rx="10" fill="#eef5f1" stroke="#b4cfc4"/><text x="42" y="92" font-size="19" font-weight="600">1 持久结算命令</text><text x="42" y="117" font-size="15">请求和金额已保存，worker 退出后可重新读取</text><path d="M340 135v20m-5-5l5 5 5-5" stroke="#28685c" fill="none" stroke-width="2"/><rect x="24" y="160" width="632" height="68" rx="10" fill="#eef5f1" stroke="#b4cfc4"/><text x="42" y="187" font-size="19" font-weight="600">2 同一 SQL 事务</text><text x="42" y="212" font-size="15">认领 ID、原子扣款、保存结果和 outbox</text><path d="M340 230v20m-5-5l5 5 5-5" stroke="#28685c" fill="none" stroke-width="2"/><rect x="24" y="255" width="632" height="68" rx="10" fill="#eef5f1" stroke="#b4cfc4"/><text x="42" y="282" font-size="19" font-weight="600">3 消费缓存事件</text><text x="42" y="307" font-size="15">按事件去重，更新余额并释放请求预留</text><path d="M340 325v20m-5-5l5 5 5-5" stroke="#28685c" fill="none" stroke-width="2"/><rect x="24" y="350" width="632" height="68" rx="10" fill="#eef5f1" stroke="#b4cfc4"/><text x="42" y="377" font-size="19" font-weight="600">4 故障恢复</text><text x="42" y="402" font-size="15">提交前回滚；提交后继续投递；缓存重建需版本</text><text x="24" y="466" font-size="14">随书实验只验证数据库部分，不实现真实 Redis 消费者</text></g></svg>